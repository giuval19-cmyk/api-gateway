spring.application.name=api-gateway
server.port=8080

# Lista delle rotte pubbliche gestita interamente a livello di configurazione
app.security.public-urls=/iam-service/auth/login, /iam-service/auth/register, /v3/api-docs, /swagger-ui


spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG

# Espone gli endpoint di Actuator sul web
management.endpoints.web.exposure.include=gateway,health,info
# Opzionale: permette di vedere i dettagli delle rotte senza restrizioni
management.endpoint.gateway.enabled=true

# --- SPRINGDOC / SWAGGER AGGREGATOR ---
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
#Disabilita l'URL di default (quello che punta a se stesso)
springdoc.swagger-ui.disable-swagger-default-url=true
#Disabilita l'auto-rilevamento delle rotte (evita i nomi brutti/URL)
springdoc.swagger-ui.discovery.enabled=false
#Definisci i microservizi
springdoc.swagger-ui.urls[0].name=Support-Service
springdoc.swagger-ui.urls[0].url=/support-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=DSS-Service
springdoc.swagger-ui.urls[1].url=/dss-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=IAM-Service
springdoc.swagger-ui.urls[2].url=/iam-service/v3/api-docs

# Permetti le chiamate da qualsiasi origine (comodo per lo sviluppo)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
# Permetti tutti i metodi (GET, POST, ecc.)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
# Permetti tutti gli header
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

## =====================================================================
## INTEGRAZIONE CON CONFIG SERVER VIA EUREKA
## =====================================================================
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.config.import=optional:configserver:
spring.cloud.config.username=${CONFIG_SERVER_USER}
spring.cloud.config.password=${CONFIG_SERVER_PWD}
#Configurazione di retry se il config server non e' pronto
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=15
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.multiplier=1.5
spring.cloud.config.retry.max-interval=10000